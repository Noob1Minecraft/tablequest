name: Deploy TableQuest to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /tablequest/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published site
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --retry 6 --retry-delay 5 --retry-all-errors --max-time 30 "$SITE_URL" -o site.html
          curl --fail --retry 6 --retry-delay 5 --retry-all-errors --max-time 30 "${SITE_URL}manifest.webmanifest" -o manifest.json
          curl --fail --retry 6 --retry-delay 5 --retry-all-errors --max-time 30 "${SITE_URL}sw.js" -o sw.js
          python - <<'PY'
          import json, os, re, urllib.request
          from urllib.parse import urljoin
          from pathlib import Path
          html = Path('site.html').read_text()
          assert 'TableQuest' in html
          assert json.loads(Path('manifest.json').read_text())['name'] == 'TableQuest'
          assert 'precacheAndRoute' in Path('sw.js').read_text()
          for path in re.findall(r'(?:src|href)="([^"]+\.(?:js|css))"', html):
              with urllib.request.urlopen(urljoin(os.environ['SITE_URL'], path)) as response:
                  assert response.status == 200
                  print('OK:', response.url)
          print('Published HTML, JS, CSS, manifest and service worker verified.')
          PY
  public-e2e:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: github-pages
            url: https://noob1minecraft.github.io/tablequest/
          - target: vercel
            url: https://tablequest-pink.vercel.app/
          - target: render
            url: https://tablequest-2crp.onrender.com/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Wait for production branding update
        run: node scripts/wait-production.mjs
        env:
          PLAYWRIGHT_BASE_URL: ${{ matrix.url }}
      - name: Verify public mobile and desktop guest journeys
        run: npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: ${{ matrix.url }}
      - name: Save public screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-browser-review-${{ matrix.target }}
          path: |
            artifacts/
            test-results/
          retention-days: 7
